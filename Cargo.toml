[workspace]
members = [
  "crates/nuriteo-server",
  "crates/system-core",
  "crates/system-wasm"
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.97"

# Keep the checked-in WASM adapter reproducible across checkout paths. Native
# workspace crates retain the regular dev profile; only the two crates linked
# into system_wasm omit DWARF data containing absolute source paths.
[profile.dev.package.system-core]
debug = 0

[profile.dev.package.system-wasm]
debug = 0

# Opt in from a crate with `[lints] workspace = true`. These denies stay off
# `nuriteo-server` because `cargo clippy --workspace -- -D warnings` would
# otherwise fail on that crate's existing public API.
[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
cast_possible_truncation = "deny"
