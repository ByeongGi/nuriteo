name: CI / Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Validation channel; this workflow never publishes
        required: true
        default: internal
        type: choice
        options:
          - internal
          - beta-candidate
          - stable

permissions:
  contents: read

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate ${{ inputs.channel }} candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - run: cargo install --locked cargo-audit --version 0.22.2
      - run: cargo install --locked cargo-deny --version 0.20.2
      - run: pnpm install --frozen-lockfile
      - run: security/check-dependencies.sh
      - run: pnpm exec tsc --noEmit --pretty false
      - run: node tooling/checks/check-release-policy.ts
      - run: node tooling/checks/check-performance-baseline.ts
      - run: node tooling/checks/check-soak-baseline.ts
      - run: node tooling/release/package-sdk.ts --write-fingerprint
      - run: node tooling/checks/check-sdk-public-release.ts
      - run: node tooling/checks/check-sdk-publish-rehearsal.ts
      - run: node tooling/checks/check-release-readiness.ts
      - run: node tooling/checks/check-release-ops-sg29.ts
      - run: node tooling/checks/check-public-beta-readiness.ts
      - run: node tooling/checks/check-release-provenance.ts
      - run: node tooling/release/offline-manifest.test.mjs
      - run: node release/offline/tests/check-tooling.mjs
      - run: node release/offline/tests/check-convergence.mjs
      - run: node tooling/checks/check-rc-gate.ts
      - run: bash -n release/rc/qualify-images.sh
      - run: sh -n release/offline/scripts/* release/offline/tests/check-registry.sh release/offline/tests/kind-egress.sh
      - run: node tooling/checks/check-workspace.ts
      - uses: actions/upload-artifact@v4
        with:
          name: nuriteo-release-candidate-${{ github.sha }}
          path: |
            dist/sdk
            docs/release/fingerprint.json
          if-no-files-found: error
          retention-days: 14
