name: Release provenance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release-provenance.yml"
      - "compat/**"
      - "apps/preview-service/**"
      - "docs/release/**"
      - "dist/sdk/package/**"
      - "packages/**"
      - "scripts/**"
      - "workers/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "Cargo.lock"

jobs:
  release-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit --pretty false
      - run: node tooling/checks/check-release-policy.ts
      - run: node tooling/checks/check-performance-baseline.ts
      - run: node tooling/checks/check-soak-baseline.ts
      - run: node tooling/release/package-sdk.ts
      - run: node tooling/checks/check-sdk-public-release.ts
      - run: node tooling/checks/check-sdk-publish-rehearsal.ts
      - run: node tooling/checks/check-release-readiness.ts
      - run: node tooling/checks/check-release-ops-sg29.ts
      - run: node tooling/checks/check-public-beta-readiness.ts
      - run: node tooling/checks/check-release-provenance.ts
      - run: node tooling/checks/check-workspace.ts
