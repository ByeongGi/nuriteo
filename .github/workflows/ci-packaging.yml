name: CI / Packaging

on:
  pull_request:
    paths:
      - ".github/workflows/ci-packaging.yml"
      - "apps/preview-service/**"
      - "crates/**"
      - "packages/**"
      - "tooling/release/**"
      - "vendor/**"
      - "workers/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "LICENSE"
      - "NOTICE"
      - "package.json"
      - "pnpm-lock.yaml"
      - "rust-toolchain.toml"
      - "tsconfig*.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci-packaging.yml"
      - "apps/preview-service/**"
      - "crates/**"
      - "packages/**"
      - "tooling/release/**"
      - "vendor/**"
      - "workers/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "LICENSE"
      - "NOTICE"
      - "package.json"
      - "pnpm-lock.yaml"
      - "rust-toolchain.toml"
      - "tsconfig*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-packaging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  packaging:
    name: Build and verify artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:preview
      - run: pnpm package:sdk
      - run: pnpm test:sdk-consumer
      - run: pnpm check:sdk-public-release
      - run: pnpm check:sdk-publish-rehearsal
      - uses: actions/upload-artifact@v4
        with:
          name: nuriteo-packaging-${{ github.sha }}
          path: |
            apps/preview-service/dist
            dist/sdk
          if-no-files-found: error
          retention-days: 7
