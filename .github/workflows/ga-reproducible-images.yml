name: GA / Reproducible images

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ga-reproducible-images.yml"
      - "deploy/docker/**"
      - "release/ga/**"
      - "apps/web/**"
      - "crates/**"
      - "packages/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  reproduce:
    name: ${{ matrix.platform }} ${{ matrix.role }} clean digest comparison
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux/amd64, arch: amd64, role: server }
          - { runner: ubuntu-24.04, platform: linux/amd64, arch: amd64, role: web }
          - { runner: ubuntu-24.04, platform: linux/amd64, arch: amd64, role: operations }
          - { runner: ubuntu-24.04-arm, platform: linux/arm64, arch: arm64, role: server }
          - { runner: ubuntu-24.04-arm, platform: linux/arm64, arch: arm64, role: web }
          - { runner: ubuntu-24.04-arm, platform: linux/arm64, arch: arm64, role: operations }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
      - name: Install OCI inspection tools
        run: sudo apt-get update && sudo apt-get install --yes skopeo jq
      - name: Build twice from clean caches
        env:
          CONTAINER_RUNTIME: docker
          NURITEO_REPRO_BUILDER: buildx
          NURITEO_REPRO_PLATFORMS: ${{ matrix.platform }}
          NURITEO_REPRO_ROLES: ${{ matrix.role }}
          NURITEO_REPRO_REPORT: release/ga/reproducible-images-${{ matrix.role }}-${{ matrix.arch }}.json
        run: release/ga/reproducible-images.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rel-001-${{ matrix.role }}-${{ matrix.arch }}-${{ github.sha }}
          path: release/ga/reproducible-images-${{ matrix.role }}-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 14

  merge-evidence:
    name: Merge native architecture evidence
    needs: reproduce
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: rel-001-*-${{ github.sha }}
          path: release/ga/native
          merge-multiple: true
      - name: Require the complete amd64 and arm64 matrix
        run: >-
          node release/ga/merge-reproducible-images.mjs
          release/ga/reproducible-images.json
          release/ga/native/reproducible-images-server-amd64.json
          release/ga/native/reproducible-images-web-amd64.json
          release/ga/native/reproducible-images-operations-amd64.json
          release/ga/native/reproducible-images-server-arm64.json
          release/ga/native/reproducible-images-web-arm64.json
          release/ga/native/reproducible-images-operations-arm64.json
      - name: Validate merged evidence
        run: node tooling/checks/check-self-hosted-reproducible-images.ts
      - uses: actions/upload-artifact@v4
        with:
          name: rel-001-complete-${{ github.sha }}
          path: release/ga/reproducible-images.json
          if-no-files-found: error
          retention-days: 30
