{{- include "nuriteo.validateIngress" . -}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "nuriteo.fullname" . }}-web
  labels:
    {{- include "nuriteo.labels" . | nindent 4 }}
    app.kubernetes.io/component: edge
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  tls:
    - secretName: {{ .Values.ingress.tls.existingSecretName }}
      hosts:
        - {{ include "nuriteo.applicationHost" . | quote }}
        {{- if .Values.preview.wildcardReady }}
        - {{ printf "*.%s" .Values.preview.baseDomain | quote }}
        {{- end }}
  rules:
    - host: {{ include "nuriteo.applicationHost" . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "nuriteo.fullname" . }}-web
                port:
                  name: http
    {{- if .Values.preview.wildcardReady }}
    - host: {{ printf "*.%s" .Values.preview.baseDomain | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "nuriteo.fullname" . }}-web
                port:
                  name: http
    {{- end }}
{{- end }}
