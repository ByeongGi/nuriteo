services:
  postgres:
    image: ${NURITEO_POSTGRES_IMAGE:-localhost/nuriteo-postgres:cmp-001}
    build:
      context: ../..
      dockerfile: deploy/compose/postgres.Dockerfile
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/tls/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/tls/server.key
    environment:
      POSTGRES_DB: nuriteo
      POSTGRES_USER: nuriteo
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
      - postgres_server_cert
      - postgres_server_key
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username nuriteo --dbname nuriteo"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  rustfs:
    image: docker.io/rustfs/rustfs@sha256:42edb61d588775f9431ff436216d14392d2234d4eb2ed68321569fbf7245b36b
    environment:
      RUSTFS_ACCESS_KEY_FILE: /run/secrets/rustfs_access_key
      RUSTFS_SECRET_KEY_FILE: /run/secrets/rustfs_secret_key
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_TLS_PATH: /etc/rustfs/tls
    secrets:
      - rustfs_access_key
      - rustfs_secret_key
    volumes:
      - rustfs_data:/data
      - type: bind
        source: ${NURITEO_RUSTFS_TLS_DIR:?set NURITEO_RUSTFS_TLS_DIR}
        target: /etc/rustfs/tls
        read_only: true
    networks:
      - data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--cacert", "/etc/rustfs/tls/ca.crt", "https://rustfs:9000/health"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  storage-init:
    image: docker.io/rustfs/rustfs@sha256:42edb61d588775f9431ff436216d14392d2234d4eb2ed68321569fbf7245b36b
    entrypoint: ["/bin/sh", "/usr/local/bin/nuriteo-rustfs-init"]
    environment:
      NURITEO_BUNDLED_S3_BUCKET: ${NURITEO_S3_BUCKET:-nuriteo}
      NURITEO_LEGACY_BROWSER_CORS_ORIGIN: ${NURITEO_EXTERNAL_URL:?set NURITEO_EXTERNAL_URL}
    secrets:
      - rustfs_access_key
      - rustfs_secret_key
    volumes:
      - type: bind
        source: ./rustfs-init.sh
        target: /usr/local/bin/nuriteo-rustfs-init
        read_only: true
      - type: bind
        source: ${NURITEO_RUSTFS_TLS_DIR:?set NURITEO_RUSTFS_TLS_DIR}
        target: /etc/rustfs/tls
        read_only: true
    networks:
      - data
    depends_on:
      rustfs:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1048576,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  storage-check:
    image: ${NURITEO_SERVER_IMAGE:-localhost/nuriteo-server:cmp-003}
    build:
      context: ../..
      dockerfile: deploy/docker/server.Dockerfile
    command: ["storage-check"]
    environment:
      NURITEO_SAVE_UPLOAD_TRANSPORT: relay
      NURITEO_S3_ENDPOINT: https://rustfs:9000
      NURITEO_S3_REGION: us-east-1
      NURITEO_S3_BUCKET: ${NURITEO_S3_BUCKET:-nuriteo}
      NURITEO_S3_ADDRESSING_STYLE: path
      NURITEO_S3_CREDENTIAL_PROVIDER: static
      NURITEO_S3_ACCESS_KEY_ID_FILE: /run/secrets/rustfs_access_key
      NURITEO_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/rustfs_secret_key
      NURITEO_S3_CA_FILE: /run/secrets/rustfs_ca
    secrets:
      - rustfs_access_key
      - rustfs_secret_key
      - rustfs_ca
    networks:
      - data
    depends_on:
      storage-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16777216,mode=1777
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  migrate:
    image: ${NURITEO_SERVER_IMAGE:-localhost/nuriteo-server:cmp-003}
    build:
      context: ../..
      dockerfile: deploy/docker/server.Dockerfile
    command: ["migrate"]
    environment:
      NURITEO_EXTERNAL_URL: ${NURITEO_EXTERNAL_URL:?set NURITEO_EXTERNAL_URL}
      NURITEO_DATABASE_URL_FILE: /run/secrets/database_url
      NURITEO_DATABASE_CA_FILE: /run/secrets/database_ca
    secrets:
      - database_url
      - database_ca
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16777216,mode=1777
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  bootstrap-admin:
    image: ${NURITEO_SERVER_IMAGE:-localhost/nuriteo-server:cmp-003}
    build:
      context: ../..
      dockerfile: deploy/docker/server.Dockerfile
    command: ["bootstrap-admin"]
    environment:
      NURITEO_EXTERNAL_URL: ${NURITEO_EXTERNAL_URL:?set NURITEO_EXTERNAL_URL}
      NURITEO_DATABASE_URL_FILE: /run/secrets/database_url
      NURITEO_DATABASE_CA_FILE: /run/secrets/database_ca
      NURITEO_BOOTSTRAP_ADMIN_EMAIL: ${NURITEO_BOOTSTRAP_ADMIN_EMAIL:?set NURITEO_BOOTSTRAP_ADMIN_EMAIL}
      NURITEO_BOOTSTRAP_ADMIN_NAME: ${NURITEO_BOOTSTRAP_ADMIN_NAME:?set NURITEO_BOOTSTRAP_ADMIN_NAME}
      NURITEO_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap_admin_password
    secrets:
      - database_url
      - database_ca
      - bootstrap_admin_password
    networks:
      - data
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16777216,mode=1777
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  core:
    image: ${NURITEO_SERVER_IMAGE:-localhost/nuriteo-server:cmp-003}
    build:
      context: ../..
      dockerfile: deploy/docker/server.Dockerfile
    command: ["serve"]
    environment:
      NURITEO_EXTERNAL_URL: ${NURITEO_EXTERNAL_URL:?set NURITEO_EXTERNAL_URL}
      NURITEO_HTTP_LISTEN_ADDR: 0.0.0.0:8080
      NURITEO_MANAGEMENT_LISTEN_ADDR: 0.0.0.0:9090
      NURITEO_LOG_FORMAT: ${NURITEO_LOG_FORMAT:-json}
      NURITEO_LOG_LEVEL: ${NURITEO_LOG_LEVEL:-info}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-none}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-none}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-none}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_EXPORTER_OTLP_TIMEOUT: ${OTEL_EXPORTER_OTLP_TIMEOUT:-5000}
      OTEL_BSP_MAX_QUEUE_SIZE: ${OTEL_BSP_MAX_QUEUE_SIZE:-2048}
      OTEL_BSP_MAX_EXPORT_BATCH_SIZE: ${OTEL_BSP_MAX_EXPORT_BATCH_SIZE:-512}
      OTEL_BLRP_MAX_QUEUE_SIZE: ${OTEL_BLRP_MAX_QUEUE_SIZE:-2048}
      OTEL_BLRP_MAX_EXPORT_BATCH_SIZE: ${OTEL_BLRP_MAX_EXPORT_BATCH_SIZE:-512}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
      OTEL_LOG_LEVEL: ${OTEL_LOG_LEVEL:-info}
      NURITEO_DATABASE_URL_FILE: /run/secrets/database_url
      NURITEO_DATABASE_CA_FILE: /run/secrets/database_ca
      NURITEO_S3_ENDPOINT: https://rustfs:9000
      NURITEO_S3_REGION: us-east-1
      NURITEO_S3_BUCKET: ${NURITEO_S3_BUCKET:-nuriteo}
      NURITEO_S3_ADDRESSING_STYLE: path
      NURITEO_S3_CREDENTIAL_PROVIDER: static
      NURITEO_S3_ACCESS_KEY_ID_FILE: /run/secrets/rustfs_access_key
      NURITEO_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/rustfs_secret_key
      NURITEO_S3_CA_FILE: /run/secrets/rustfs_ca
      NURITEO_SAVE_IDEMPOTENCY_SECRET_FILE: /run/secrets/save_idempotency_secret
      NURITEO_MASTER_KEY_FILE: /run/secrets/master_key
      NURITEO_MASTER_KEY_VERSION: ${NURITEO_MASTER_KEY_VERSION:-1}
      NURITEO_PREVIEW_SIGNING_KEY_FILE: /run/secrets/preview_signing_key
      NURITEO_SAVE_DEFAULT_QUOTA_BYTES: ${NURITEO_SAVE_DEFAULT_QUOTA_BYTES:-10737418240}
      NURITEO_SAVE_UPLOAD_TRANSPORT: relay
    secrets:
      - database_url
      - database_ca
      - rustfs_access_key
      - rustfs_secret_key
      - rustfs_ca
      - save_idempotency_secret
      - master_key
      - preview_signing_key
    networks:
      - application
      - data
    depends_on:
      bootstrap-admin:
        condition: service_completed_successfully
      storage-check:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/nuriteo-server", "healthcheck"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16777216,mode=1777
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  web:
    image: ${NURITEO_WEB_IMAGE:-localhost/nuriteo-web:cmp-003}
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
    environment:
      NURITEO_INTERNAL_API_URL: http://core:8080
      NURITEO_EXTERNAL_URL: ${NURITEO_EXTERNAL_URL:?set NURITEO_EXTERNAL_URL}
      NURITEO_PREVIEW_BASE_DOMAIN: ${NURITEO_PREVIEW_BASE_DOMAIN:?set NURITEO_PREVIEW_BASE_DOMAIN}
      NURITEO_PREVIEW_SIGNING_KEY_FILE: /run/secrets/preview_signing_key
      NURITEO_PREVIEW_WILDCARD_READY: ${NURITEO_PREVIEW_WILDCARD_READY:-false}
    secrets:
      - preview_signing_key
    ports:
      - ${NURITEO_WEB_BIND_IP:-127.0.0.1}:${NURITEO_WEB_PORT:-3000}:3000
    networks:
      - application
    depends_on:
      core:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16777216,mode=1777
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  application: {}
  data:
    internal: true

volumes:
  postgres_data:
  rustfs_data:

secrets:
  postgres_password:
    file: ${NURITEO_POSTGRES_PASSWORD_FILE:?set NURITEO_POSTGRES_PASSWORD_FILE}
  postgres_server_cert:
    file: ${NURITEO_POSTGRES_SERVER_CERT_FILE:?set NURITEO_POSTGRES_SERVER_CERT_FILE}
  postgres_server_key:
    file: ${NURITEO_POSTGRES_SERVER_KEY_FILE:?set NURITEO_POSTGRES_SERVER_KEY_FILE}
  database_url:
    file: ${NURITEO_DATABASE_URL_FILE:?set NURITEO_DATABASE_URL_FILE}
  database_ca:
    file: ${NURITEO_DATABASE_CA_FILE:?set NURITEO_DATABASE_CA_FILE}
  rustfs_access_key:
    file: ${NURITEO_RUSTFS_ACCESS_KEY_FILE:?set NURITEO_RUSTFS_ACCESS_KEY_FILE}
  rustfs_secret_key:
    file: ${NURITEO_RUSTFS_SECRET_KEY_FILE:?set NURITEO_RUSTFS_SECRET_KEY_FILE}
  rustfs_ca:
    file: ${NURITEO_RUSTFS_CA_FILE:?set NURITEO_RUSTFS_CA_FILE}
  bootstrap_admin_password:
    file: ${NURITEO_BOOTSTRAP_ADMIN_PASSWORD_FILE:?set NURITEO_BOOTSTRAP_ADMIN_PASSWORD_FILE}
  preview_signing_key:
    file: ${NURITEO_PREVIEW_SIGNING_KEY_FILE:?set NURITEO_PREVIEW_SIGNING_KEY_FILE}
  save_idempotency_secret:
    file: ${NURITEO_SAVE_IDEMPOTENCY_SECRET_FILE:?set NURITEO_SAVE_IDEMPOTENCY_SECRET_FILE}
  master_key:
    file: ${NURITEO_MASTER_KEY_FILE:?set NURITEO_MASTER_KEY_FILE}
