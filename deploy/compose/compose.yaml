x-nuriteo-cmp-002-readiness:
  core:
    live: http://127.0.0.1:8080/health/live
    ready: http://127.0.0.1:8080/health/ready
    command: ["/usr/local/bin/nuriteo-server", "healthcheck"]
  note: CMP-002 owns migration/bootstrap jobs, healthy-ready transition, and health-based startup ordering.

services:
  postgres:
    image: docker.io/library/postgres@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    environment:
      POSTGRES_DB: nuriteo
      POSTGRES_USER: nuriteo
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    security_opt:
      - no-new-privileges:true

  rustfs:
    image: docker.io/rustfs/rustfs@sha256:42edb61d588775f9431ff436216d14392d2234d4eb2ed68321569fbf7245b36b
    environment:
      RUSTFS_ACCESS_KEY_FILE: /run/secrets/rustfs_access_key
      RUSTFS_SECRET_KEY_FILE: /run/secrets/rustfs_secret_key
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_TLS_PATH: /etc/rustfs/tls
    secrets:
      - rustfs_access_key
      - rustfs_secret_key
    volumes:
      - rustfs_data:/data
      - type: bind
        source: ${NURITEO_RUSTFS_TLS_DIR:?set NURITEO_RUSTFS_TLS_DIR}
        target: /etc/rustfs/tls
        read_only: true
    networks:
      - data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  core:
    image: ${NURITEO_SERVER_IMAGE:-localhost/nuriteo-server:cmp-001}
    build:
      context: ../..
      dockerfile: deploy/docker/server.Dockerfile
    command: ["serve"]
    environment:
      NURITEO_EXTERNAL_URL: ${NURITEO_EXTERNAL_URL:?set NURITEO_EXTERNAL_URL}
      NURITEO_HTTP_LISTEN_ADDR: 0.0.0.0:8080
      NURITEO_DATABASE_URL_FILE: /run/secrets/database_url
      NURITEO_DATABASE_CA_FILE: /run/secrets/database_ca
      NURITEO_S3_ENDPOINT: https://rustfs:9000
      NURITEO_S3_REGION: us-east-1
      NURITEO_S3_BUCKET: nuriteo
      NURITEO_S3_ADDRESSING_STYLE: path
      NURITEO_S3_CREDENTIAL_PROVIDER: static
      NURITEO_S3_ACCESS_KEY_ID_FILE: /run/secrets/rustfs_access_key
      NURITEO_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/rustfs_secret_key
      NURITEO_S3_CA_FILE: /run/secrets/rustfs_ca
    secrets:
      - database_url
      - database_ca
      - rustfs_access_key
      - rustfs_secret_key
      - rustfs_ca
    networks:
      - application
      - data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16777216,mode=1777
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  web:
    image: ${NURITEO_WEB_IMAGE:-localhost/nuriteo-web:cmp-001}
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
    environment:
      NURITEO_INTERNAL_API_URL: http://core:8080
    ports:
      - ${NURITEO_WEB_BIND_IP:-127.0.0.1}:${NURITEO_WEB_PORT:-3000}:3000
    networks:
      - application
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16777216,mode=1777
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  application:
  data:
    internal: true

volumes:
  postgres_data:
  rustfs_data:

secrets:
  postgres_password:
    file: ${NURITEO_POSTGRES_PASSWORD_FILE:?set NURITEO_POSTGRES_PASSWORD_FILE}
  database_url:
    file: ${NURITEO_DATABASE_URL_FILE:?set NURITEO_DATABASE_URL_FILE}
  database_ca:
    file: ${NURITEO_DATABASE_CA_FILE:?set NURITEO_DATABASE_CA_FILE}
  rustfs_access_key:
    file: ${NURITEO_RUSTFS_ACCESS_KEY_FILE:?set NURITEO_RUSTFS_ACCESS_KEY_FILE}
  rustfs_secret_key:
    file: ${NURITEO_RUSTFS_SECRET_KEY_FILE:?set NURITEO_RUSTFS_SECRET_KEY_FILE}
  rustfs_ca:
    file: ${NURITEO_RUSTFS_CA_FILE:?set NURITEO_RUSTFS_CA_FILE}
