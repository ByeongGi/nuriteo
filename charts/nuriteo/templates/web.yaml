apiVersion: v1
kind: Service
metadata:
  name: {{ include "nuriteo.fullname" . }}-web
  labels:
    {{- include "nuriteo.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    {{- include "nuriteo.selectorLabels" (dict "root" . "component" "web") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nuriteo.fullname" . }}-web
  labels:
    {{- include "nuriteo.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "nuriteo.selectorLabels" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nuriteo.selectorLabels" (dict "root" . "component" "web") | nindent 8 }}
      annotations:
        {{- include "nuriteo.rolloutAnnotations" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "nuriteo.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.web.terminationGracePeriodSeconds }}
      securityContext:
        {{- include "nuriteo.podSecurityContext" . | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- include "nuriteo.imagePullSecrets" $ | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "nuriteo.image" (list . .Values.images.web) | quote }}
          imagePullPolicy: {{ .Values.images.web.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NURITEO_INTERNAL_API_URL
              value: {{ printf "http://%s-core:%v" (include "nuriteo.fullname" .) .Values.core.service.port | quote }}
            - name: NURITEO_EXTERNAL_URL
              valueFrom: { configMapKeyRef: { name: {{ include "nuriteo.runtimeConfigName" . }}, key: NURITEO_EXTERNAL_URL } }
            - name: NURITEO_PREVIEW_BASE_DOMAIN
              valueFrom: { configMapKeyRef: { name: {{ include "nuriteo.runtimeConfigName" . }}, key: NURITEO_PREVIEW_BASE_DOMAIN } }
            - name: NURITEO_PREVIEW_WILDCARD_READY
              valueFrom: { configMapKeyRef: { name: {{ include "nuriteo.runtimeConfigName" . }}, key: NURITEO_PREVIEW_WILDCARD_READY } }
            - name: NURITEO_PREVIEW_SIGNING_KEY_FILE
              value: /run/secrets/nuriteo/application/preview-signing-key
          startupProbe:
            tcpSocket: { port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /sign-in, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            {{- include "nuriteo.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            {{- include "nuriteo.webSecretVolumeMounts" . | nindent 12 }}
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        {{- include "nuriteo.webSecretVolumes" . | nindent 8 }}
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
