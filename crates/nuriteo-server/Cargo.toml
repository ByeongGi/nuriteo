[package]
name = "nuriteo-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "nuriteo-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4.6.6", default-features = false, features = ["error-context", "help", "std", "suggestions", "usage"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.48.0", features = ["macros", "rt", "signal", "sync", "time"] }
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde"] }
url = "2.5.7"
uuid = { version = "1.22.0", features = ["v4"] }

[dev-dependencies]
serde_json = "1.0.151"
tower = { version = "0.5.3", features = ["util"] }
