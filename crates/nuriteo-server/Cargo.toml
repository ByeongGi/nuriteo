[package]
name = "nuriteo-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "nuriteo-server"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", default-features = false, features = ["error-context", "help", "std", "suggestions", "usage"] }
tokio = { version = "1.48.0", features = ["macros", "rt", "signal", "sync", "time"] }
